name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 4.0.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (ya viene en el runner; solo se aceptan licencias)
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Preparar la app web (www/)
        run: npm run build:web

      - name: Generar proyecto Android
        run: |
          npx cap add android
          node scripts/patch-android.js

      - name: Íconos de la app
        run: npm run android:icons

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Firma fija (permite actualizar el APK encima del anterior)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ChartConverterV4-${VERSION_NAME}.apk"
          ls -la dist

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ChartConverterV4-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Chart Converter V4 — APK ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/*.apk
